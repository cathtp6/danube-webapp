<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b4d">
  <meta name="description" content="Danube Grand Journey — 中歐多瑙河旅程">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>Danube Grand Journey</title>
</head>
<body>
  <header class="topbar">
    <button id="menuButton" class="icon-button" aria-label="開啟目錄" aria-controls="sidePanel" aria-expanded="false">☰</button>
    <a class="brand" href="#top">Danube Grand Journey</a>
    <div class="top-actions">
      <button id="themeButton" class="icon-button" aria-label="切換深色模式">◐</button>
      <button id="installButton" class="install-button" hidden>安裝 App</button>
    </div>
  </header>
  <div id="backdrop" class="backdrop" hidden></div>
  <aside id="sidePanel" class="side-panel" aria-label="頁面目錄">
    <div class="panel-heading"><span>Journey Map</span><button id="closeButton" class="icon-button" aria-label="關閉目錄">×</button></div>
    <nav id="toc" class="toc"><p class="muted">正在載入目錄…</p></nav>
  </aside>
  <main id="top" class="page-shell">
    <div id="status" class="status">正在載入旅程內容…</div>
    <article id="content" class="content" aria-live="polite"></article>
    <div id="error" class="error" hidden>
      <h1>內容尚未載入</h1>
      <p>請確認原始檔案名稱為 <code>danube_grand_journey.html</code>，並與本頁放在同一個 GitHub Pages 資料夾。</p>
    </div>
  </main>
  <button id="toTop" class="to-top" aria-label="回到頂部" hidden>↑</button>
  <script src="app.js" defer></script>
</body>
</html>
